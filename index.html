<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TÁNGER · MISIÓN SECRETA</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#090b10;--card:#121722;--card2:#171d29;--text:#f5f6f8;--muted:#9da6b5;--gold:#e8b85a;--red:#e85d5d;--green:#62d39a;--blue:#70a7ff;--line:#293142}
*{box-sizing:border-box} body{margin:0;background-color:#06034d;background-image:linear-gradient(45deg,transparent 46%,rgba(217,164,65,.12) 47%,rgba(217,164,65,.12) 53%,transparent 54%),linear-gradient(-45deg,transparent 46%,rgba(217,164,65,.12) 47%,rgba(217,164,65,.12) 53%,transparent 54%);background-size:70px 70px;color:var(--text);;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input{font:inherit} button{cursor:pointer;border:0}.wrap{max-width:900px;margin:auto;padding:22px 16px 70px}.logo{text-align:center;letter-spacing:.2em;font-weight:900;font-size:13px;color:var(--gold)}h1{font-size:clamp(32px,8vw,64px);line-height:.95;margin:10px 0;text-align:center;letter-spacing:-.05em}h2{margin:0 0 8px}h3{margin:0 0 7px}.sub{text-align:center;color:var(--muted);max-width:620px;margin:0 auto 25px}.panel{background:rgba(18,23,34,.9);border:1px solid var(--line);border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 18px 50px #0005}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.role{padding:18px;border:1px solid var(--line);background:var(--card2);border-radius:18px;text-align:left}.role b{font-size:21px}.role small{display:block;color:var(--muted);margin-top:5px}.btn{background:var(--gold);color:#17120a;padding:12px 16px;border-radius:12px;font-weight:850}.btn.secondary{background:#242c3b;color:var(--text)}.btn.danger{background:var(--red);color:#fff}.btn.success{background:var(--green);color:#07130d}.btn.blue{background:var(--blue);color:#08111f}.btn:disabled{opacity:.4;cursor:not-allowed}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row .fit{flex:0 0 auto}.field{width:100%;background:#0c111a;border:1px solid var(--line);color:#fff;padding:13px 14px;border-radius:12px;outline:none}.field:focus{border-color:var(--gold)}.code{font-size:34px;font-weight:900;letter-spacing:.18em;text-align:center;color:var(--gold);padding:8px}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tab{white-space:nowrap;background:#171d29;color:var(--muted);padding:10px 13px;border-radius:999px;border:1px solid var(--line)}.tab.active{background:var(--gold);color:#17120a;font-weight:800}.mission{border:1px solid var(--line);background:linear-gradient(145deg,#151b27,#0f141e);border-radius:18px;padding:17px;margin:11px 0}.mission.active{border-color:#8d7135}.mission.done{border-color:#347e5d}.mission.pending{border-color:#6d5e28}.mission.locked{opacity:.58}.badge{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.08em;padding:5px 8px;border-radius:999px;background:#252d3b;color:#b9c1cf;margin-bottom:9px}.badge.gold{background:#3b301c;color:#f2cc77}.badge.green{background:#183528;color:#79e0a8}.badge.red{background:#3b1e22;color:#ff9b9b}.pts{float:right;color:var(--gold);font-weight:900}.mission p{color:#c4cad5;line-height:1.5}.hint{font-size:13px;color:var(--muted);line-height:1.45}.score{font-size:34px;font-weight:950;color:var(--gold)}.playerline{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.playerline:last-child{border:0}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--muted);margin-right:7px}.dot.on{background:var(--green);box-shadow:0 0 10px #62d39a}.feed{max-height:260px;overflow:auto}.event{padding:9px 0;border-bottom:1px solid #202737;font-size:14px}.event small{color:var(--muted)}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#f5f6f8;color:#0a0d12;padding:12px 16px;border-radius:14px;font-weight:750;z-index:50;box-shadow:0 12px 40px #0008;display:none;max-width:90%}.hidden{display:none!important}.mini{font-size:12px;color:var(--muted)}.dangerbox{background:#28171a;border:1px solid #633136;padding:13px;border-radius:14px}.reveal{background:linear-gradient(145deg,#2a2111,#15120d);border-color:#6c5526}.missionlist{font-size:13px;color:#cbd0da}.missionlist li{margin:6px 0}.center{text-align:center}.sep{height:1px;background:var(--line);margin:18px 0}
@media(max-width:600px){.wrap{padding:18px 12px 60px}.panel{padding:16px;border-radius:18px}.row{flex-direction:column;align-items:stretch}.row .fit{width:100%}.btn{width:100%}.code{font-size:29px}}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
</div>
<div id="toast" class="toast"></div>

<script>
const GAME_CONFIG = {
  title:"TÁNGER",
  subtitle:"MISIÓN SECRETA",
  players:{
    Felipe:{emoji:"🦞",missions:[
      ["F1","LA DISTRACCIÓN","Consigue que Adrián deje su móvil sobre una mesa y se aleje al menos 30 segundos. SÁCATE MÍNIMO 10 FOTOS DURANTE ESE TIEMPO.","3"],
      ["F2","EL MODELO","Consigue que Adrián pose para una foto exactamente como tú quieres, sin darle una orden directa ni decir que es una misión.","3"],
      ["F3","PIENSA UN POCO","Haz que Adrián acuse espontáneamente a Iris de estar detrás de una conspiración del viaje. Tú no puedes acusarla directamente.","5"],
      ["F4","LOS EXPLORADORES","En las Cuevas de Hércules, consigue una foto épica de explorador con Adrián. No puedes decirle que forma parte del juego.","3"],
      ["F5","NEGOCIOS","Consigue que el grupo cambie de plan una vez porque tú has presentado una alternativa convincente, sin decir que ese era tu objetivo. Ten en cuenta que Iris (yo) es muy lista, jeje","4"],
      ["F6","ES FILIPINO","Haz que Adrián crea durante al menos 2 minutos que has entendido mal una instrucción importante del grupo. Luego corrígelo.","4"],
      ["F7","LA REVELACIÓN","Antes del final, escribe cuál crees que es la misión principal de Adrián y cuál la de Iris.","6"]
    ]},
    Adrián:{emoji:"🐢",missions:[
      ["A1","EL MÁS LOCAL","En una conversación natural, consigue que un local diga espontáneamente que Felipe parece filipino, asiático, o pregunte por su origen. No puedes pagar, presionar ni dictar la frase.","4"],
      ["A2","SABOTAJE","Consigue que Felipe cambie de opinión sobre dónde comer y acepte una propuesta tuya sin saber que ese era tu objetivo.","3"],
      ["A3","CITA ROMÁNTICA","Consigue que Felipe te invite voluntariamente a tomar un té, sin pedirle directamente que pague por ti.","4"],
      ["A4","MODELO","Consigue que Iris haga una pose concreta para una foto sin decirle que es una misión.","3"],
      ["A5","RECOMENDACIÓN","Haz que Felipe o Iris pregunte a un desconocido por una recomendación que tú ya hayas decidido previamente. Tú no puedes formular la pregunta.","4"],
      ["A6","PERDIDOS","Consigue que Felipe te siga durante al menos 3 minutos hacia un sitio que ni tú sepas a dónde vamos. Si alguien te pregunta a dónde vamos exactamente, ignóralos.","4"],
      ["A7","THE REVEAL","Antes del final, escribe cuál crees que es la misión principal de Felipe y cuál la de Iris.","6"]
    ]},
    Iris:{emoji:"🐠",missions:[
      ["I1","THE MASTERPLAN","Asegúrate de que el grupo llega al primer destino y al siguiente punto importante sin retrasos graves, pero sin parecer la directora del viaje.","4"],
      ["I2","THE SHEPHERD","Consigue que Felipe y Adrián estén juntos en el lugar que necesitas en el momento adecuado, sin darles una orden directa.","3"],
      ["I3","THE CHAOS MANAGER","Durante 30 minutos, haz que Felipe y Adrián crean que tú no sabes qué está pasando con las misiones de los demás.","5"],
      ["I4","THE SECRET BOSS","Crea discretamente una oportunidad real para que Felipe y Adrián puedan completar una de sus misiones, sin que sepan que les has ayudado.","5"],
      ["I5","THE INTERRUPTOR","En algún momento, cambia una decisión pequeña del grupo usando una razón completamente normal. Debe afectar al plan, aunque solo sea durante unos minutos.","4"],
      ["I6","THE DETECTIVE","Antes del final, escribe cuál crees que es la misión principal de Felipe y cuál la de Adrián.","6"]
    ]}
  }
};

const state = {
  role:null, host:false, room:null, peer:null, conn:null,
  players:{}, pending:{}, accusations:[], log:[], round:1, revealed:false,
  connected:false
};
const app=document.getElementById("app");

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display="none",2600);}
function saveLocal(){localStorage.setItem("tanger-v2-role",state.role||"");}
function addLog(text){state.log.unshift({text,at:new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})});state.log=state.log.slice(0,80);}
function allMissions(role){return GAME_CONFIG.players[role].missions;}
function missionBy(role,id){return allMissions(role).find(x=>x[0]===id);}
function initialPlayers(){Object.keys(GAME_CONFIG.players).forEach(p=>{if(!state.players[p])state.players[p]={score:0,completed:[],pending:[],online:p===state.role};});}
function broadcast(){
  if(!state.host || !state.connections)return;
  const packet={type:"state",state:{
    players:state.players,pending:state.pending,accusations:state.accusations,log:state.log,round:state.round,revealed:state.revealed
  }};
  Object.values(state.connections).forEach(c=>{try{c.send(packet)}catch(e){}});
}
state.connections={};

function landing(){
app.innerHTML=`<div class="logo">48 HOURS · 3 PLAYERS · 0 TRUST</div>
<h1>TÁNGER<br><span style="color:var(--gold)">SECRET MISSIONS</span></h1>
<p class="sub">V2 · juego sincronizado. Cada uno ve sus cartas. Iris puede controlar la partida.</p>
<div class="panel">
<h2>🎮 Crear partida</h2>
<p class="hint">La persona que crea la partida será el Game Master. Recomendado: <b>Iris</b>.</p>
<button class="btn" onclick="chooseRole(true)">Crear partida como Game Master</button>
<div class="sep"></div>
<h2>🔑 Unirse a una partida</h2>
<input id="joincode" class="field" placeholder="Código de 6 letras" maxlength="6" style="text-transform:uppercase">
<div style="height:9px"></div>
<div class="grid">${Object.entries(GAME_CONFIG.players).map(([p,v])=>`<button class="role" onclick="joinAs('${p}')"><b>${v.emoji} ${p}</b><small>Entrar como ${p}</small></button>`).join("")}</div>
</div>
<div class="panel"><div class="hint">💡 Para jugar: abre la misma web en los 3 móviles. Iris crea la partida y comparte el código. Felipe y Adrián introducen el código y eligen su nombre.</div></div>`;
}

function chooseRole(isHost){
  app.innerHTML=`<div class="logo">CHOOSE YOUR ALTER EGO</div><h1>¿QUIÉN ERES?</h1><p class="sub">Solo verás las misiones de tu personaje.</p>
  <div class="grid">${Object.entries(GAME_CONFIG.players).map(([p,v])=>`<button class="role" onclick="${isHost?`startHost('${p}')`:`startGuest('${p}')`}"><b>${v.emoji} ${p}</b><small>${isHost&&p==="Iris"?"★ recomendado para Game Master":"Entrar como "+p}</small></button>`).join("")}</div>`;
}
function chooseRoleHost(){chooseRole(true)}
function startHost(role){
  state.role=role;state.host=true;state.room=Math.random().toString(36).slice(2,8).toUpperCase();state.players={};initialPlayers();
  state.players[role].online=true;
  const id="tanger-"+state.room.toLowerCase();
  state.peer=new Peer(id);
  state.peer.on("open",()=>{saveLocal();renderHost();});
  state.peer.on("connection",c=>{
    c.on("open",()=>{
      state.connections[c.peer]=c;
      c.on("data",data=>{
        if(data.type==="join"){ 
          const p=data.role;
          if(!GAME_CONFIG.players[p])return;
          state.players[p]=state.players[p]||{score:0,completed:[],pending:[],online:false};
          state.players[p].online=true;
          addLog(`${p} se ha conectado.`);
          c.send({type:"state",state:{players:state.players,pending:state.pending,accusations:state.accusations,log:state.log,round:state.round,revealed:state.revealed}});
          broadcast();renderHost();
        }
        if(data.type==="complete"){handleComplete(data.role,data.id,c);}
        if(data.type==="accuse"){state.accusations.push({from:data.role,to:data.to,at:Date.now()});addLog(`${data.role} ha hecho una acusación.`);broadcast();renderHost();}
        if(data.type==="message"){addLog(`💥 ${data.text}`);broadcast();renderHost();}
      });
      c.on("close",()=>{Object.keys(state.connections).forEach(k=>{if(state.connections[k]===c)delete state.connections[k]});});
    });
  });
  state.peer.on("error",e=>{console.error(e);toast("No se pudo crear la partida. Prueba otra vez.");});
}
function handleComplete(role,id,c){
  if(!state.players[role])return;
  const already=(state.players[role].completed||[]).includes(id);
  if(already)return;
  state.players[role].pending=state.players[role].pending||[];
  if(!state.players[role].pending.includes(id))state.players[role].pending.push(id);
  addLog(`${role} ha enviado una misión para aprobación.`);
  c.send({type:"ack",msg:"Enviada al Game Master. 🤫"});
  broadcast();renderHost();
}
function joinAs(role){
  const code=(document.getElementById("joincode")?.value||"").trim().toUpperCase();

  if(code.length!==6){
    toast("Escribe el código de 6 letras.");
    return;
  }

  state.role=role;
  state.host=false;
  state.room=code;

  // Mostrar inmediatamente que estamos intentando conectar
  app.innerHTML=`
    <div class="panel center">
      <h2>🔌 Conectando...</h2>
      <p class="hint">
        Entrando como <b>${GAME_CONFIG.players[role].emoji} ${role}</b>
      </p>
      <p class="hint">Código: <b>${code}</b></p>
      <p class="hint">Espera unos segundos...</p>
    </div>
  `;

  try{
    state.peer=new Peer();

    // Si PeerJS consigue conectarse a su servidor
    state.peer.on("open",()=>{
      console.log("PeerJS abierto:",state.peer.id);

      state.conn=state.peer.connect(
        "tanger-"+code.toLowerCase(),
        {reliable:true}
      );

      if(!state.conn){
        app.innerHTML=`
          <div class="panel center">
            <h2>❌ No se pudo conectar</h2>
            <p class="hint">No se pudo crear la conexión con Iris.</p>
            <button class="btn" onclick="reset()">Volver a intentar</button>
          </div>
        `;
        return;
      }

      state.conn.on("open",()=>{
        console.log("Conectado con Iris");

        state.connected=true;

        state.conn.send({
          type:"join",
          role:role
        });

        saveLocal();
        renderGuest();

        toast("¡Conectado! Que empiece el caos. 🤫");
      });

      state.conn.on("data",data=>{
        console.log("Datos recibidos:",data);

        if(data.type==="state"){
          Object.assign(state,{
            players:data.state.players,
            pending:data.state.pending,
            accusations:data.state.accusations,
            log:data.state.log,
            round:data.state.round,
            revealed:data.state.revealed
          });

          renderGuest();
        }

        if(data.type==="ack"){
          toast(data.msg);
        }

        if(data.type==="surprise"){
          toast(data.text);
        }
      });

      state.conn.on("close",()=>{
        state.connected=false;

        app.innerHTML=`
          <div class="panel center">
            <h2>⚠️ Conexión perdida</h2>
            <p class="hint">
              Se ha perdido la conexión con Iris.
            </p>
            <button class="btn" onclick="reset()">Volver a intentar</button>
          </div>
        `;

        toast("Se perdió la conexión con Iris.");
      });

      state.conn.on("error",e=>{
        console.error("Error de conexión:",e);

        app.innerHTML=`
          <div class="panel center">
            <h2>❌ Error de conexión</h2>
            <p class="hint">
              No hemos podido conectar con la partida de Iris.
            </p>
            <p class="hint">
              Comprueba el código <b>${code}</b> y que Iris tenga la partida abierta.
            </p>
            <button class="btn" onclick="reset()">Intentar de nuevo</button>
          </div>
        `;
      });
    });

    // Error al conectar con PeerJS
    state.peer.on("error",e=>{
      console.error("PeerJS error:",e);

      app.innerHTML=`
        <div class="panel center">
          <h2>❌ No se pudo conectar</h2>
          <p class="hint">
            Error de conexión con el servidor.
          </p>
          <p class="hint">
            Código de partida: <b>${code}</b>
          </p>
          <p class="hint">
            Error: <b>${e.type||"desconocido"}</b>
          </p>
          <button class="btn" onclick="reset()">Intentar de nuevo</button>
        </div>
      `;

      toast("Error de conexión.");
    });

    // Si se desconecta del servidor de señalización
    state.peer.on("disconnected",()=>{
      console.warn("PeerJS desconectado");

      try{
        state.peer.reconnect();
      }catch(e){
        console.error("No se pudo reconectar:",e);
      }
    });

  }catch(e){
    console.error("Error creando Peer:",e);

    app.innerHTML=`
      <div class="panel center">
        <h2>❌ Error</h2>
        <p class="hint">
          No se pudo iniciar la conexión.
        </p>
        <p class="hint">${e.message||e}</p>
        <button class="btn" onclick="reset()">Volver a intentar</button>
      </div>
    `;
  }
}

function reset(){try{state.peer&&state.peer.destroy()}catch(e){}location.reload();}
function missionCard(role,m,index,hostView=false){
 const id=m[0], done=(state.players[role]?.completed||[]).includes(id), pending=(state.players[role]?.pending||[]).includes(id);
 const locked=index>=state.round && index!==0;
 let status=done?["green","COMPLETADA"]:pending?["gold","PENDIENTE DE APROBACIÓN"]:locked?["red","BLOQUEADA"]:["gold","ACTIVA"];
 if(hostView) locked=false;
 return `<div class="mission ${done?"done":pending?"pending":locked?"locked":""}">
   <span class="badge ${status[0]}">${status[1]}</span><span class="pts">+${m[3]} pts</span>
   <h3>${esc(m[1])}</h3>
   <p>${esc(m[2])}</p>
   ${role==="Felipe" && id==="F2" ? `<img src="felipe-pose.png" alt="Referencia secreta" style="width:100%;max-width:420px;display:block;margin:14px auto 4px;border-radius:14px;border:1px solid var(--gold);">` : ""}
   ${locked&&!hostView?`<div class="hint">🔒 Se desbloquea cuando Iris avance la ronda.</div>`:
     done?`<div class="hint">✅ Punto conseguido.</div>`:
     pending?`<div class="hint">⏳ Iris tiene que aprobarla.</div>`:
     hostView?`<div class="row"><button class="btn success fit" onclick="approve('${role}','${id}')">Aprobar +${m[3]}</button><button class="btn danger fit" onclick="reject('${role}','${id}')">Rechazar</button></div>`:
     `<button class="btn fit" onclick="submitMission('${id}')">Hecha 🤫</button>`}
 </div>`;
}
function header(role,host=false){
 const p=state.players[role]||{score:0};return `<div class="row"><div><div class="mini">${GAME_CONFIG.players[role].emoji} JUGADOR</div><h2>${role}</h2></div><div class="score" style="text-align:right">${p.score||0}<span class="mini"> pts</span></div></div>`;
}
function renderGuest(){
 if(!state.connected){app.innerHTML=`<div class="panel center"><h2>Conectando…</h2><p class="hint">Buscando a Iris y entrando en la partida.</p></div>`;return}
 const ms=allMissions(state.role);
 app.innerHTML=`<div class="logo">${GAME_CONFIG.title} · ${state.room}</div>
 ${header(state.role)}
 <div class="panel"><div class="row"><div><b>Ronda ${state.round}</b><div class="hint">No enseñes tu pantalla. Nunca.</div></div><div class="fit"><button class="btn secondary" onclick="showRules()">Reglas</button></div></div></div>
 <div class="tabs"><button class="tab active">🎴 Mis misiones</button><button class="tab" onclick="showAccuse()">🕵️ Acusar</button><button class="tab" onclick="showFeed()">📡 Actividad</button><button class="tab" onclick="showReveal()">🏁 Final</button></div>
 <div id="content">${ms.map((m,i)=>missionCard(state.role,m,i)).join("")}</div>
 <div class="panel center"><button class="btn danger" onclick="reset()">Salir de la partida</button></div>`;
}
function renderHost(){
 state.players[state.role].online=true;
 app.innerHTML=`<div class="logo">${GAME_CONFIG.title} · GAME MASTER · ${state.room}</div>
 <div class="panel center"><div class="mini">CÓDIGO PARA FELIPE + ADRIÁN</div><div class="code">${state.room}</div><button class="btn secondary" onclick="navigator.clipboard?.writeText(state.room);toast('Código copiado')">Copiar código</button></div>
 <div class="panel">${Object.keys(GAME_CONFIG.players).map(p=>`<div class="playerline"><span><span class="dot ${state.players[p]?.online?"on":""}"></span>${GAME_CONFIG.players[p].emoji} <b>${p}</b></span><span><b>${state.players[p]?.score||0} pts</b> · ${(state.players[p]?.completed||[]).length} hechas</span></div>`).join("")}</div>
 <div class="tabs"><button class="tab active">👑 Control</button><button class="tab" onclick="hostMissions()">🎴 Misiones</button><button class="tab" onclick="hostAccusations()">🕵️ Acusaciones</button><button class="tab" onclick="hostFinal()">🏁 Final</button></div>
 <div id="hostcontent"></div>
 <div class="panel"><h3>📡 Actividad</h3><div class="feed">${state.log.length?state.log.map(x=>`<div class="event">${esc(x.text)} <small>· ${x.at}</small></div>`).join(""):`<div class="hint">Todavía no ha pasado nada… sospechoso.</div>`}</div></div>`;
 hostControl();
}
function hostControl(){
 const pending=[];Object.entries(state.players).forEach(([p,v])=>(v.pending||[]).forEach(id=>pending.push([p,id])));
 document.getElementById("hostcontent").innerHTML=`<div class="panel">
 <h2>👑 Game Master</h2>
 <p class="hint">Tú controlas el ritmo. Los jugadores solo pueden enviar misiones; tú decides si cuentan.</p>
 <div class="row"><div><b>Ronda actual: ${state.round}</b><div class="hint">Las misiones 1–${state.round+1} están disponibles (la primera siempre está activa).</div></div><button class="btn fit" onclick="advanceRound()">Desbloquear siguiente ronda</button></div>
 </div>
 <div class="panel"><h3>⏳ Pendientes de aprobar (${pending.length})</h3>
 ${pending.length?pending.map(([p,id])=>{const m=missionBy(p,id);return `<div class="mission pending"><span class="badge gold">${p}</span><span class="pts">+${m[3]}</span><h3>${m[1]}</h3><p>${m[2]}</p><div class="row"><button class="btn success fit" onclick="approve('${p}','${id}')">APROBAR</button><button class="btn danger fit" onclick="reject('${p}','${id}')">RECHAZAR</button></div></div>`}).join(""):`<div class="hint">Nada pendiente. Disfruta del té.</div>`}
 </div>
 <div class="panel"><h3>💣 Misión sorpresa</h3><p class="hint">Lanza una frase que todos reciben, sin revelar por qué.</p><div class="row"><input id="surprise" class="field" placeholder="Ej.: Durante los próximos 10 min, nadie puede decir 'vale'."><button class="btn danger fit" onclick="surprise()">Lanzar caos</button></div></div>
 <div class="panel dangerbox"><b>⚠️ Consejo</b><p class="hint">No enseñes el panel de Game Master. Tú sabes las misiones de todos.</p></div>`;
}
function advanceRound(){state.round=Math.min(7,state.round+1);addLog(`👑 Iris ha desbloqueado la ronda ${state.round}.`);broadcast();renderHost();toast("Nueva ronda desbloqueada.");}
function approve(role,id){
 const p=state.players[role];if(!p)return;
 p.pending=(p.pending||[]).filter(x=>x!==id);if(!(p.completed||[]).includes(id)){p.completed.push(id);p.score=(p.score||0)+Number(missionBy(role,id)[3]);}
 addLog(`✅ ${role} ha ganado ${missionBy(role,id)[3]} puntos.`);
 broadcast();renderHost();toast("Misión aprobada.");
}
function reject(role,id){state.players[role].pending=(state.players[role].pending||[]).filter(x=>x!==id);addLog(`❌ Misión rechazada para ${role}.`);broadcast();renderHost();toast("Misión rechazada.");}
function submitMission(id){state.conn.send({type:"complete",role:state.role,id});toast("Enviada al Game Master. 🤫");}
function surprise(){
 const t=(document.getElementById("surprise").value||"").trim();if(!t)return;
 addLog(`💥 Misión sorpresa: ${t}`);Object.values(state.connections).forEach(c=>{try{c.send({type:"surprise",text:t})}catch(e){}});
 document.getElementById("surprise").value="";broadcast();renderHost();toast("Caos lanzado.");
}
function hostMissions(){
 document.getElementById("hostcontent").innerHTML=`<div class="panel"><h2>🎴 Todas las cartas</h2><p class="hint">Vista secreta del Game Master.</p>${Object.entries(GAME_CONFIG.players).map(([p,v])=>`<div class="sep"></div><h3>${v.emoji} ${p}</h3>${v.missions.map((m,i)=>missionCard(p,m,i,true)).join("")}`).join("")}</div>`;
}
function hostAccusations(){
 document.getElementById("hostcontent").innerHTML=`<div class="panel"><h2>🕵️ Acusaciones</h2>${state.accusations.length?state.accusations.map(a=>`<div class="event"><b>${a.from}</b> acusa a <b>${a.to}</b> <small>· ${new Date(a.at).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</small></div>`).join(""):`<div class="hint">Nadie se fía todavía.</div>`}</div>`;
}
function hostFinal(){
 const rows=Object.entries(state.players).map(([p,v])=>`<div class="playerline"><b>${p}</b><span>${v.score||0} pts · ${(v.completed||[]).length}/${allMissions(p).length}</span></div>`).join("");
 document.getElementById("hostcontent").innerHTML=`<div class="panel reveal"><h2>🏁 FINAL</h2><p class="hint">Cuando estés en el momento adecuado, pulsa revelar. Esto cambia la vista de todos.</p>${rows}<div style="height:10px"></div><button class="btn" onclick="revealGame()">REVELAR TODO 🔥</button></div>`;
}
function revealGame(){state.revealed=true;addLog("🏁 EL GAME MASTER HA REVELADO LA PARTIDA.");broadcast();renderHost();toast("Final revelado.");}
function showRules(){alert("REGLAS\\n\\n1. No enseñes tus cartas.\\n2. No obligues, pagues o engañes de forma peligrosa a desconocidos.\\n3. No toques pertenencias ajenas.\\n4. Una misión hecha se envía a Iris para aprobación.\\n5. Iris decide si cuenta.\\n6. Si una situación se vuelve incómoda, aborta la misión.\\n\\nObjetivo: conseguir puntos sin que los demás descubran lo que estás haciendo.");}
function showAccuse(){
 app.innerHTML=`<div class="logo">${GAME_CONFIG.title}</div>${header(state.role)}<div class="panel"><h2>🕵️ Acusar</h2><p class="hint">Elige quién crees que está detrás de algo. La acusación queda registrada para el final.</p><div class="grid">${Object.keys(GAME_CONFIG.players).filter(p=>p!==state.role).map(p=>`<button class="role" onclick="accuse('${p}')"><b>${GAME_CONFIG.players[p].emoji} ${p}</b><small>Le tengo fichado/a.</small></button>`).join("")}</div></div><button class="btn secondary" onclick="renderGuest()">← Volver a mis misiones</button>`;
}
function accuse(to){state.conn.send({type:"accuse",role:state.role,to});toast(`Acusación enviada contra ${to}.`);}
function showFeed(){app.innerHTML=`<div class="logo">${GAME_CONFIG.title}</div>${header(state.role)}<div class="panel"><h2>📡 Actividad</h2><p class="hint">Aquí solo aparecen eventos públicos.</p><div class="feed">${state.log.map(x=>`<div class="event">${esc(x.text)} <small>· ${x.at}</small></div>`).join("")||"<div class='hint'>Silencio sospechoso.</div>"}</div></div><button class="btn secondary" onclick="renderGuest()">← Volver</button>`;}
function showReveal(){
 if(!state.revealed){app.innerHTML=`<div class="panel center"><h1 style="font-size:42px">🔒</h1><h2>EL FINAL AÚN NO ESTÁ DESBLOQUEADO</h2><p class="hint">Cuando Iris revele la partida, aquí aparecerá todo.</p><button class="btn secondary" onclick="renderGuest()">Volver</button></div>`;return}
 const rank=Object.entries(state.players).sort((a,b)=>(b[1].score||0)-(a[1].score||0));
 app.innerHTML=`<div class="logo">THE TRUTH</div><h1>🏁 FIN</h1><p class="sub">Ya no hay secretos.</p><div class="panel">${rank.map(([p,v],i)=>`<div class="playerline"><span><b>${i+1}. ${GAME_CONFIG.players[p].emoji} ${p}</b></span><span class="score" style="font-size:24px">${v.score||0}</span></div>`).join("")}</div>${Object.entries(GAME_CONFIG.players).map(([p,v])=>`<div class="panel"><h2>${v.emoji} ${p}</h2><p class="hint">Misiones completadas:</p><ul class="missionlist">${v.missions.map(m=>`<li>${(state.players[p]?.completed||[]).includes(m[0])?"✅":"❌"} <b>${m[1]}</b> · ${m[3]} pts</li>`).join("")}</ul></div>`).join("")}<div class="panel center"><button class="btn secondary" onclick="reset()">Cerrar partida</button></div>`;
}

window.chooseRole=chooseRole;window.startHost=startHost;window.joinAs=joinAs;window.renderGuest=renderGuest;window.reset=reset;window.submitMission=submitMission;window.approve=approve;window.reject=reject;window.advanceRound=advanceRound;window.surprise=surprise;window.hostMissions=hostMissions;window.hostAccusations=hostAccusations;window.hostFinal=hostFinal;window.revealGame=revealGame;window.showRules=showRules;window.showAccuse=showAccuse;window.accuse=accuse;window.showFeed=showFeed;window.showReveal=showReveal;

landing();
</script>
</body>
</html>
